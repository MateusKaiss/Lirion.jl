policy = "Solver config is decided per ROLE. Centralized = objective oracle; distributed = the study object (algorithm × sectioning × coupling × k). The two roles may use different solvers when that reflects their role; both are fixed rules per category (no case-by-case cherry-picking). Within the distributed results, ADMM and ALADIN share the SAME solver per formulation (guaranteed: resolve_optimizer dispatches on base_model, not on the algorithm)."
