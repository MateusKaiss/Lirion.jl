  status = "pass"
  rho = 300000.0
  mu = 300000.0
  rho_growth = 1.0
  mu_growth = 1.0
  qp_reg = 100000.0
  adaptive = false
  alpha3 = 1.0
  mode = "primal"
  no_prox = false
  modgrad = false
