# ====================================================================
# Parameters for case73_ieee_rts (k = 3 zones), paper Table I
# ====================================================================
# One [[cell]] per (formulation, sectioning, coupling): 18 blocks, each with
# a [cell.admm] and a [cell.aladin] sub-block = 36 method-rows.
# run.jl reads every block whose status is "pass" and solves it with these
# exact parameters; status = "non_convergent" blocks are the cells the
# paper prints as x: they are written out as placeholders and not solved.
#
# Keys the driver consumes:
#   ADMM   : rho, adaptive, max_iter  (+ lifted_flow on three case500 SOCWRNL cells)
#   ALADIN : rho, mu, rho_growth, mu_growth, qp_reg, adaptive, alpha3, mode,
#            globalization, max_iter, and the canonicity toggles
#            (AC/DC: no_prox, modgrad, bound_detect; SOCWRNL: prox_mode,
#            bound_detect, lam_bar).
#   max_iter is the certified stopping iteration plus a 2000-iteration margin
#   (case500 keeps the run-length cap used in the reproduction).
# verdict / expected_gap_pct / note are provenance only (ignored by run.jl).
# ====================================================================

[_meta]
case = "case73_ieee_rts"
k = 3
cell_blocks = 18
method_rows = 36
pass = 35
non_convergent = 1

# --------------------------------------------------------------------
# DC
# --------------------------------------------------------------------
# DC  state / tie_line
[[cell]]
case = "case73_ieee_rts"
k = 3
formulation = "dc"
sectioning = "tie_line"
coupling = "state"
  [cell.admm]
    verdict = "pass"
  status = "pass"
  rho = 10000000.0
  adaptive = false
  bound_detect = "primal_dual"
  max_iter = 16763
  [cell.aladin]
    verdict = "pass"
  status = "pass"
  rho = 1000.0
  mu = 100000.0
  rho_growth = 1.0
  mu_growth = 1.0
  qp_reg = 100.0
  adaptive = false
  alpha3 = 1.0
  mode = "primal"
  no_prox = false
  modgrad = false
  bound_detect = "primal_dual"
  max_iter = 2031
  globalization = "alg3_original"

