# DC
# --------------------------------------------------------------------
# DC  state / tie_line
[[cell]]
case = "case118_ieee"
k = 4
formulation = "dc"
sectioning = "tie_line"
coupling = "state"
  [cell.admm]
    verdict = "pass"
  status = "pass"
  rho = 10000000.0
  adaptive = false
  bound_detect = "primal_dual"
  max_iter = 17434
  [cell.aladin]
    verdict = "pass"
  status = "pass"
  rho = 1000.0
