# ============================================================
# selected_cases.toml
# ============================================================
# Declarative case list for the Lirion distributed-OPF paper.
# Scope of the prepare stage: case selection + copy + partitioning.
# No solver / tuning / distributed runs are driven from here.
#
# Variants (std/api/sad) are auto-discovered by 01_select_cases.jl
# from the PGLib tree. Per-case partition counts `k` live in
# configs/partitioning.toml.
# ============================================================

[meta]
description = "PGLib-OPF cases selected for the Lirion distributed-OPF paper"
pglib_env_var = "PGLIB_OPF_ROOT"
pglib_default_root = "/home/mateus-kaiss/Downloads/papers/pglib-opf-master"
# std -> <root>/pglib_opf_<name>.m
# api -> <root>/api/pglib_opf_<name>__api.m
# sad -> <root>/sad/pglib_opf_<name>__sad.m

